# EduKZ — nginx site config for edu-platform.online
#
# Install:
#   sudo cp deploy/nginx/edu-platform.online.conf /etc/nginx/sites-available/edu-platform.online
#   sudo ln -s /etc/nginx/sites-available/edu-platform.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then enable HTTPS (auto-rewrites this file for port 443):
#   sudo certbot --nginx -d edu-platform.online -d www.edu-platform.online
#
# Assumes the repo is cloned at /var/www/edu-platform and the frontend has been
# built (`cd frontend && npm ci && npm run build`) → /var/www/edu-platform/frontend/dist

server {
    listen 80;
    listen [::]:80;
    server_name edu-platform.online www.edu-platform.online;

    # Static frontend (Vite build)
    root /var/www/edu-platform/frontend/dist;
    index index.html;

    # Upload/body limit (server.js accepts up to 10mb JSON)
    client_max_body_size 12m;

    # gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API → Node/Express (PM2) on localhost:5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Hashed Vite assets — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every other path serves index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }
}
